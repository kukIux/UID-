name: Build UID seccomp module

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Download Android NDK r27d (27.3.13750724)
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r27d
          add-to-path: false

      - name: Expose NDK under the exact expected version path
        run: |
          mkdir -p /opt/android-sdk/ndk
          ln -s "${{ steps.setup-ndk.outputs.ndk-path }}" /opt/android-sdk/ndk/27.3.13750724
          echo "ANDROID_NDK_HOME=/opt/android-sdk/ndk/27.3.13750724" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=/opt/android-sdk" >> "$GITHUB_ENV"

      - name: Build module
        run: |
          python tools/uid-seccomp-module/build.py --module-only

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: cq-uid-seccomp
          path: build/**/*.zip*

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: cq-uid-seccomp
          path: dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/**/*.zip*
          generate_release_notes: true
